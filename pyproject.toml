[project]
name = "gp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Naod Abebe", email = "naodabeben@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "geopy>=2.5.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
gp = "gp:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "geopy",
]
